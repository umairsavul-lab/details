# DETAILS Financials — Netlify Configuration

[build]
  publish = "."
  functions = "."

# Security headers — applied to all pages
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent your page being embedded in iframes on other sites
    X-Frame-Options = "SAMEORIGIN"
    # Stop browser MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Force HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Control what info is sent in referrer headers
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Content Security Policy — restricts what can load on your page
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://api.anthropic.com; frame-ancestors 'none'"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache the main HTML (always fresh)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirect all routes to index.html (SPA support)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# API routes — proxy to Netlify functions
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai-proxy"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/gas-proxy"
  status = 200
